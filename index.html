<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mi plan · Web + Ciberseguridad + IA</title>
<style>
:root{--bg:#f7f8fa;--fg:#161a20;--mut:#5d6675;--card:#fff;--bd:#dde1e8;--acc:#2f6bff;--acc2:#e8efff;--ok:#16a34a;--warn:#d97706;--r:12px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--fg:#e7eaf0;--mut:#98a2b3;--card:#161b22;--bd:#2a313c;--acc:#7aa7ff;--acc2:#1b2740;--ok:#4ade80;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#e7eaf0;--mut:#98a2b3;--card:#161b22;--bd:#2a313c;--acc:#7aa7ff;--acc2:#1b2740;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}h1{font-size:1.5rem;margin:.4em 0}h2{font-size:1.15rem;margin:1.2em 0 .4em}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
nav{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;order:3}nav a{white-space:nowrap;text-decoration:none;color:var(--fg);padding:6px 11px;border-radius:999px;font-size:.93rem}nav a.on{background:var(--acc2);color:var(--acc);font-weight:600}
.sw{position:relative;flex:1 1 200px;max-width:420px;margin-left:auto}#q{width:100%}#sr{position:absolute;left:0;right:0;top:110%;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);max-height:60vh;overflow:auto;box-shadow:0 8px 24px #0003}
#sr a{display:block;padding:8px 12px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--bd)}#sr a:hover{background:var(--acc2)}#sr small{color:var(--mut);display:block}
main{max-width:960px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin:10px 0}.cur{border:2px solid var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center}.mut{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.st{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px}.st .v{font-size:1.5rem;font-weight:700}
.bar{height:9px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.blk{border-top:1px dashed var(--bd);padding:8px 0}.blk label{display:flex;gap:9px;align-items:flex-start}input[type=checkbox]{width:19px;height:19px;margin-top:4px;flex:none;accent-color:var(--acc)}
.lk{display:flex;flex-wrap:wrap;gap:4px 12px;margin:3px 0 0 28px;font-size:.9rem}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:6px 10px}textarea{width:100%;min-height:80px}.num{width:70px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.d{color:#dc2626}
details{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin:8px 0;padding:6px 12px}summary{cursor:pointer;font-weight:600;padding:4px 0}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:999px;padding:1px 9px;font-size:.8rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.ok{border-color:var(--ok);background:#16a34a22}.opt.bad{border-color:#dc2626;background:#dc262622}
.big{font-size:1.4rem;text-align:center;padding:26px 10px}.tw{overflow-x:auto}table{border-collapse:collapse;min-width:600px;width:100%}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#111;color:#fff;padding:9px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:50}#toast.show{opacity:1;transform:translate(-50%,0)}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px}#gate form{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:26px;max-width:340px;width:100%;text-align:center}#gate input[type=password]{width:100%;margin:12px 0}
[hidden]{display:none!important}
</style></head><body>
<div id="gate"><form id="gf"><div style="font-size:2.4rem">🔒</div><h1>Mi plan de estudio</h1><p class="mut">Ingresa la clave para continuar</p>
<input id="gp" type="password" autocomplete="current-password" placeholder="Clave" required autofocus>
<label class="mut"><input id="gr" type="checkbox"> Recordar en este dispositivo</label><br><br>
<button class="p" style="width:100%">Entrar</button><p id="ge" class="mut" role="alert"></p></form></div>
<div id="app" hidden>
<header><b>📚 Mi plan</b><div class="sw"><input id="q" type="search" placeholder="Buscar: flexbox, git, XSS…  ( / )" autocomplete="off"><div id="sr" hidden></div></div><button id="th" title="Modo claro/oscuro">🌓</button><nav id="nav"></nav></header>
<main id="main"></main></div><div id="toast"></div>
<script>
(function(){const t=Date.now();function L(s,ok,no){const e=document.createElement("script");e.src=s+"?t="+t;e.onload=ok;e.onerror=no;document.head.appendChild(e)}
L("content.js",function(){let i=1;(function n(){L("topics/t"+i+".js",function(){i++;n()},function(){L("app.js")})})()},function(){document.getElementById("gate").innerHTML="<p style='padding:30px'>No se pudo cargar content.js</p>"})})();
</script></body></html>
